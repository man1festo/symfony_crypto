# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Application\EventListener\KernelExceptionEventListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }
    App\Application\Security\AuthService:
        arguments:
            $tokenTTL: '%env(JWT_TTL_SEC)%'
            $privateKeyPath: '%env(JWT_PRIVATE_KEY_PATH)%'
    App\Application\Security\JWTAuthenticator:
        arguments:
            $publicKeyPath: '%env(JWT_PUBLIC_KEY_PATH)%'
    Symfony\Bridge\Monolog\Handler\ElasticsearchLogstashHandler:
        arguments:
            - '%env(ELASTICSEARCH_HOST)%'
            - 'monolog'
            - '@es_client'
            - DEBUG
            - true
            - 9.2.0
    App\Infrastructure\Storage\MetricsStorage:
        arguments:
            - '%env(GRAPHITE_HOST)%'
            - '%env(GRAPHITE_PORT)%'
            - '%env(GRAPHITE_NAMESPACE)%'
    doctrine_memcached_provider:
        class: Memcached
        factory: Symfony\Component\Cache\Adapter\MemcachedAdapter::createConnection
        arguments:
            - '%env(MEMCACHED_DSN)%'
            -   PREFIX_KEY: 'my_app_doctrine'

    App\Infrastructure\Repository\OrderRepositoryInterface:
        alias: App\Infrastructure\Repository\OrderRepositoryCacheDecorator

    redis_client:
        class: Redis
        factory: Symfony\Component\Cache\Adapter\RedisAdapter::createConnection
        arguments:
            - '%env(REDIS_DSN)%'

    redis_adapter:
        class: Symfony\Component\Cache\Adapter\RedisAdapter
        arguments:
            - '@redis_client'
            - 'my_app'

    App\Application\Symfony\AdapterCountingDecorator:
        arguments:
            $adapter: '@redis_adapter'

    App\Infrastructure\Repository\OrderRepositoryCacheDecorator:
        arguments:
            $cache: '@redis_tag_aware_adapter'

    redis_tag_aware_adapter:
        class: Symfony\Component\Cache\Adapter\RedisTagAwareAdapter
        arguments:
            - '@redis_client'
            - 'my_app'

    App\Infrastructure\Bus\RabbitMqBus:
        calls:
            - [ 'registerProducer', [ !php/enum App\Infrastructure\Bus\AmqpExchangeEnum::CreateOrders, '@old_sound_rabbit_mq.create_orders_producer' ] ]
