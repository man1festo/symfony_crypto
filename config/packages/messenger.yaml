framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            doctrine:
                dsn: "%env(MESSENGER_DOCTRINE_TRANSPORT_DSN)%"
            amqp:
                dsn: "%env(MESSENGER_AMQP_TRANSPORT_DSN)%"
                options:
                    exchange:
                        name: 'old_sound_rabbit_mq.create_orders'
                        type: direct
                serializer: 'messenger.transport.symfony_serializer'
            update_feed:
                dsn: "%env(MESSENGER_AMQP_TRANSPORT_DSN)%"
                options:
                    exchange:
                        name: 'old_sound_rabbit_mq.update_feed'
                        type: direct
                serializer: 'messenger.transport.symfony_serializer'
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            # 'App\Message\YourMessage': async
            App\Domain\DTO\CreateOrdersDTO: amqp
            App\Domain\DTO\UpdateFeedDTO: update_feed

