name: crypto-symfony
services:

    php-fpm:
        build: docker
        container_name: 'php-crypto'
        ports:
            - '9001:9000'

        user: 1000:1000
        volumes:
            - ./:/app
        working_dir: /app
        networks:
            - crypto

    nginx:
        image: nginx
        container_name: 'nginx-crypto'
        working_dir: /app
        ports:
            - '8888:80'
        volumes:
            - ./:/app
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - crypto

    postgres:
        image: postgres:15
        ports:
            - 25432:5432
        container_name: 'postgresql-crypto'
        working_dir: /app
        restart: always
        environment:
            POSTGRES_DB: 'crypto'
            POSTGRES_USER: 'man1festo'
            POSTGRES_PASSWORD: '85gth3s1A'
        volumes:
            - dump:/app/dump
            - postgresql:/var/lib/postgresql/data
        networks:
            - crypto

    elasticsearch:
        image: elasticsearch:9.2.0
        container_name: 'elasticsearch'
        environment:
            - cluster.name=docker-cluster
            - bootstrap.memory_lock=true
            - discovery.type=single-node
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
            - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
        ulimits:
            memlock:
                soft: -1
                hard: -1
        ports:
            - 9200:9200
            - 9300:9300
        networks:
            - crypto

    kibana:
        image: kibana:9.2.0
        container_name: 'kibana'
        depends_on:
            - elasticsearch
        ports:
            - 5601:5601
        networks:
            - crypto

    graphite:
        image: graphiteapp/graphite-statsd
        container_name: 'graphite'
        restart: always
        ports:
            - 8000:80
            - 2003:2003
            - 2004:2004
            - 2023:2023
            - 2024:2024
            - 8125:8125/udp
            - 8126:8126
        networks:
            - crypto

    grafana:
        image: grafana/grafana
        container_name: 'grafana'
        restart: always
        ports:
            - 3000:3000
        networks:
            - crypto

    memcached:
        image: memcached:latest
        container_name: 'memcached'
        restart: always
        ports:
            - 11211:11211
        networks:
            - crypto

    redis:
        container_name: 'redis'
        image: redis:alpine
        ports:
            - 6379:6379
        networks:
            - crypto
    rabbitmq:
        image: rabbitmq:3-management
        working_dir: /app
        hostname: rabbit-mq
        container_name: 'rabbit-mq'
        ports:
            - 15672:15672
            - 5672:5672
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        networks:
            - crypto

    supervisor:
        build: docker/supervisor
        container_name: 'supervisor'
        volumes:
            - ./:/app
            - ./docker/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf
        working_dir: /app
        command: [ "supervisord", "-c", "/etc/supervisor/supervisord.conf" ]
        networks:
            - crypto

volumes:
    dump:
    postgresql:
networks:
    crypto:
