before_script:
    - eval $(ssh-agent -s)
    - echo $SSH_PRIVATE_KEY | base64 -d |tr -d '\r'
    - echo $SSH_PRIVATE_KEY | base64 -d |tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

deploy_server1:
    stage: deploy
    environment:
        name: server1
        url: $SERVER1
    script:
        - ssh $SSH_USER@$SERVER1 "sudo rm -rf /app &&
            sudo mkdir /app &&
            sudo chmod a+rwx /app &&
            cd /app &&
            git clone http://gitea.pozdniakov.pro/root/crypto.git . &&
            sudo chown www-data:www-data . -R &&
            bash ./deploy.sh $SERVER1"
    only:
        - main
